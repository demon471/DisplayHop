name: Build

# 只在推送版本 tag 时构建（v1.0.0、v1.2.3 …）。
# 普通 push / PR 不编译，避免每次提交都跑一遍 macOS 构建。
on:
  push:
    tags: ["v*"]
  # 手动触发，便于临时出包
  workflow_dispatch:
    inputs:
      tag:
        description: "版本号（如 v1.0.0），留空则用当前 SHA"
        required: false
        default: ""

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
          echo "runner arch: $(uname -m)"

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
            if [ -z "$TAG" ]; then
              TAG="v0.0.0-$(git rev-list --count HEAD)"
            fi
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          export TAG
          ./tools/version.sh --github
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "resolved: tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Verify resolved version
        run: |
          set -euo pipefail
          # 守门：版本号解析失败时立刻报错，而不是把空值传给 xcodebuild
          test -n "${{ steps.version.outputs.marketing_version }}" || (echo "✗ marketing_version 解析失败" && exit 1)
          test -n "${{ steps.version.outputs.build_number }}" || (echo "✗ build_number 解析失败" && exit 1)
          echo "marketing_version=${{ steps.version.outputs.marketing_version }}"
          echo "build_number=${{ steps.version.outputs.build_number }}"

      - name: Generate Xcode project
        run: xcodegen generate

      # macos-15 runner 是 arm64，但 Xcode 自带 x86_64 SDK，可直接交叉编译。
      # 注意：不能同时用 -arch（会与 destination 冲突），要用 ARCHS=。
      - name: Build (arm64)
        run: |
          xcodebuild \
            -project DisplayHop.xcodeproj \
            -scheme DisplayHop \
            -configuration Release \
            -destination 'platform=macOS' \
            ARCHS="arm64" \
            ONLY_ACTIVE_ARCH=NO \
            MARKETING_VERSION="${{ steps.version.outputs.marketing_version }}" \
            CURRENT_PROJECT_VERSION="${{ steps.version.outputs.build_number }}" \
            build \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            -derivedDataPath build/DerivedData-arm64

      - name: Build (x64)
        run: |
          xcodebuild \
            -project DisplayHop.xcodeproj \
            -scheme DisplayHop \
            -configuration Release \
            -destination 'platform=macOS' \
            ARCHS="x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            MARKETING_VERSION="${{ steps.version.outputs.marketing_version }}" \
            CURRENT_PROJECT_VERSION="${{ steps.version.outputs.build_number }}" \
            build \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            -derivedDataPath build/DerivedData-x64

      - name: Verify build artifacts
        run: |
          # 校验逻辑放在 tools/verify_build.sh，本地与 CI 跑同一份代码
          ./tools/verify_build.sh \
            "build/DerivedData-arm64/Build/Products/Release/DisplayHop.app" \
            "${{ steps.version.outputs.marketing_version }}" \
            arm64
          ./tools/verify_build.sh \
            "build/DerivedData-x64/Build/Products/Release/DisplayHop.app" \
            "${{ steps.version.outputs.marketing_version }}" \
            x86_64

      - name: Package DMGs
        run: |
          # 产物名用英文：GitHub Release 会把资源名里的非 ASCII 字符整个吞掉，
          # 中文名会变成「-1.0.0-arm64.dmg」这种缺头缺尾的名字。
          ./tools/make_dmg.sh \
            "build/DerivedData-arm64/Build/Products/Release/DisplayHop.app" \
            "build/dmg" \
            "${{ steps.version.outputs.marketing_version }}" \
            arm64
          ./tools/make_dmg.sh \
            "build/DerivedData-x64/Build/Products/Release/DisplayHop.app" \
            "build/dmg" \
            "${{ steps.version.outputs.marketing_version }}" \
            x64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DisplayHop-${{ steps.version.outputs.tag }}
          path: build/dmg/*.dmg
          if-no-files-found: error

      - name: Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.marketing_version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          cat > release-notes.md <<'EOF'
          ## 下载

          | 文件 | 适用机型 |
          |---|---|
          | `DisplayHop-VERSION-arm64.dmg` | Apple 芯片（M1/M2/M3/M4/M5，2020 年后的 Mac） |
          | `DisplayHop-VERSION-x64.dmg` | Intel 芯片 Mac |

          不确定自己是哪种？点左上角  → 关于本机，看「芯片」那一行。

          ## 安装

          1. 打开 DMG，把「屏跃」拖进「应用程序」
          2. 首次打开若被拦截：右键点击 App → 打开，或执行
             `xattr -dr com.apple.quarantine "/Applications/屏跃.app"`
          3. 在「系统设置 → 隐私与安全性 → 辅助功能」里勾选「屏跃」
             （不勾选的话快捷键能触发，但窗口不会移动）

          ## 默认快捷键

          | 操作 | 快捷键 |
          |---|---|
          | 移动到下一屏 | `⌃⌥→` |
          | 移动到上一屏 | `⌃⌥←` |

          可在设置里自定义。

          > 本项目未做 Apple 公证（没有开发者证书），首次打开需要右键→打开。
          EOF
          sed -i '' "s/VERSION/$VERSION/g" release-notes.md 2>/dev/null || sed -i "s/VERSION/$VERSION/g" release-notes.md

          # 同名 Release 已存在时先删掉（重新推送 tag 的场景）
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" \
            build/dmg/*.dmg \
            --title "屏跃 $VERSION" \
            --notes-file release-notes.md
