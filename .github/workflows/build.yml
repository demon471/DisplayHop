name: Build

# 只在推送版本 tag 时构建（v1.0.0、v1.2.3 …）。
# 普通 push / PR 不编译，避免每次提交都跑一遍 macOS 构建。
on:
  push:
    tags: ["v*"]
  # 手动触发，便于临时出包
  workflow_dispatch:
    inputs:
      tag:
        description: "版本号（如 v1.0.0），留空则用当前 SHA"
        required: false
        default: ""

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
          echo "runner arch: $(uname -m)"

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
            if [ -z "$TAG" ]; then
              TAG="v0.0.0-$(git rev-list --count HEAD)"
            fi
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          export TAG
          ./tools/version.sh --github
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "resolved: tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Verify resolved version
        run: |
          set -euo pipefail
          # 守门：版本号解析失败时立刻报错，而不是把空值传给 xcodebuild
          test -n "${{ steps.version.outputs.marketing_version }}" || (echo "✗ marketing_version 解析失败" && exit 1)
          test -n "${{ steps.version.outputs.build_number }}" || (echo "✗ build_number 解析失败" && exit 1)
          echo "marketing_version=${{ steps.version.outputs.marketing_version }}"
          echo "build_number=${{ steps.version.outputs.build_number }}"

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (universal)
        run: |
          # Universal 构建用 ARCHS= 指定（不能同时用 -arch，那会与 destination 冲突）。
          # macos-15 runner 是 arm64，但 Xcode 自带 x86_64 SDK，可直接交叉编译。
          xcodebuild \
            -project DisplayHop.xcodeproj \
            -scheme DisplayHop \
            -configuration Release \
            -destination 'platform=macOS' \
            ARCHS="x86_64 arm64" \
            ONLY_ACTIVE_ARCH=NO \
            MARKETING_VERSION="${{ steps.version.outputs.marketing_version }}" \
            CURRENT_PROJECT_VERSION="${{ steps.version.outputs.build_number }}" \
            build \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            -derivedDataPath build/DerivedData

      - name: Verify build artifacts
        run: |
          # 校验逻辑放在 tools/verify_build.sh，本地与 CI 跑同一份代码
          ./tools/verify_build.sh \
            "build/DerivedData/Build/Products/Release/DisplayHop.app" \
            "${{ steps.version.outputs.marketing_version }}"

      - name: Package DMG
        run: |
          ./tools/make_dmg.sh \
            "build/DerivedData/Build/Products/Release/DisplayHop.app" \
            "build/dmg" \
            "${{ steps.version.outputs.marketing_version }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DisplayHop-${{ steps.version.outputs.tag }}
          path: build/dmg/*.dmg
          if-no-files-found: error

      - name: Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 同名 Release 已存在时先删掉（重新推送 tag 的场景）
          gh release delete "${{ steps.version.outputs.tag }}" --yes --cleanup-tag 2>/dev/null || true
          gh release create "${{ steps.version.outputs.tag }}" \
            build/dmg/*.dmg \
            --title "屏跃 ${{ steps.version.outputs.marketing_version }}" \
            --generate-notes
