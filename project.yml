name: DisplayHop
options:
  bundleIdPrefix: com.johnbebee
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: zh-Hans

packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    # 固定 2.3.0：它的 swift-tools-version 是 5.11，Xcode 16 / 26 都能解析。
    # 3.x 全系要求 tools-version 6.2（需要 Xcode 26），
    # GitHub 的 macos-15 runner（Xcode 16）无法解析，会导致 CI 失败。
    exactVersion: 2.3.0

settings:
  base:
    SWIFT_VERSION: "5.0"
    # 本项目无开发者证书，用 ad-hoc 签名（“Sign to Run Locally”）。
    # 可直接分发，但用户首次打开需右键→打开，或清除隔离属性。
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.1"
    CURRENT_PROJECT_VERSION: "2"
    # 用 apple-generic 版本系统，让 Xcode 自己写入版本键。
    # 否则当 MARKETING_VERSION 传空时，Xcode 会把 Info.plist 里的
    # CFBundleShortVersionString / CFBundleVersion 静默删除。
    VERSIONING_SYSTEM: apple-generic

targets:
  DisplayHop:
    type: application
    platform: macOS
    sources:
      - DisplayHop
    dependencies:
      - package: KeyboardShortcuts
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # 不设 ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME：
        # 未指定时 App 自动跟随系统设置里的强调色（“外观 → 强调色”）。
    info:
      path: DisplayHop/Info.plist
      properties:
        CFBundleDisplayName: 屏跃
        # 版本号由构建时注入（CI 从 tag 提取，见 tools/version.sh）
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities

  DisplayHopTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - DisplayHopTests
    dependencies:
      - target: DisplayHop
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  DisplayHop:
    build:
      targets:
        DisplayHop: all
        DisplayHopTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - DisplayHopTests
